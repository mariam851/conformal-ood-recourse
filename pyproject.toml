[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-trees"
version = "0.1.0"
description = "Conformalized tree-based ensembles for OOD detection and certified recourse"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
models = ["lightgbm>=4.3", "xgboost>=2.0", "catboost>=1.2"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
